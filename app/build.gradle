plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'

}

android {
    signingConfigs {
        release {
            storeFile file('\\home\\linuxlite\\Desktop\\AndroidProjects\\DigitalBoard\\app\\keystore\\digitlaboard.jks')
            storePassword 'India123@'
            keyAlias 'key0'
            keyPassword 'India123@'
        }
    }
    packagingOptions{
        exclude "META-INF/DEPENDENCIES"
    }

    namespace 'com.adnan.digitalboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.adnan.digitalboard"
        minSdk 27
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Disable code shrinking and obfuscation
            minifyEnabled false
            shrinkResources false  // Optional but recommended when minify is false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.1"
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

}

dependencies {
    implementation 'androidx.compose.runtime:runtime:1.5.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation(platform "androidx.compose:compose-bom:2023.08.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    implementation(platform 'androidx.compose:compose-bom:2023.08.00')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation fileTree(dir:'libs',include:['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.takisoft.preferencex:preferencex:1.1.0'
    implementation 'com.razorpay:checkout:1.6.33'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation files('libs/libwebrtc-123.0.0.aar')
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.3'
    implementation 'io.socket:socket.io-client:2.1.2'
